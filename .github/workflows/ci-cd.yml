name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 5

      - name: Resumo de cobertura
        if: always()
        run: |
          if [ ! -f target/site/jacoco/jacoco.csv ]; then
            echo "Relatório de cobertura não gerado." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Cobertura (JaCoCo)"
            awk -F, 'NR > 1 { bm += $6; bc += $7; lm += $8; lc += $9 } END {
              printf "| Métrica | Cobertura |\n|---|---|\n"
              printf "| Linhas | %.2f%% (%d/%d) |\n", 100 * lc / (lc + lm), lc, lc + lm
              printf "| Ramos | %.2f%% (%d/%d) |\n", 100 * bc / (bc + bm), bc, bc + bm
            }' target/site/jacoco/jacoco.csv
          } >> "$GITHUB_STEP_SUMMARY"

  sonar:
    name: SonarCloud
    needs: build-and-test
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'push' && contains(fromJSON('["main", "develop"]'), github.ref_name))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B verify sonar:sonar

  build-and-push-image:
    name: Build & push no ECR
    needs: [build-and-test, sonar]
    if: >-
      !cancelled() && needs.build-and-test.result == 'success' && needs.sonar.result == 'success'
      && github.event_name == 'push' && contains(fromJSON('["main", "develop"]'), github.ref_name)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      publicada: ${{ steps.vars.outputs.publicar }}
    env:
      AMBIENTE: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Login no ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolver repositório do ambiente
        id: vars
        run: |
          echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          if ! REPO=$(aws ssm get-parameter --name "/oficina/${AMBIENTE}/execution/ecr-repository-url" \
                        --query 'Parameter.Value' --output text 2>&1); then
            grep -q ParameterNotFound <<<"$REPO" || { echo "$REPO"; exit 1; }
            echo "::notice::ECR de ${AMBIENTE} não provisionado, push pulado."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          elif ! SAIDA=$(aws ecr describe-repositories --repository-names "${REPO##*/}" 2>&1); then
            grep -q RepositoryNotFoundException <<<"$SAIDA" || { echo "$SAIDA"; exit 1; }
            echo "::notice::ECR de ${AMBIENTE} não existe, push pulado."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "repository=${REPO}" >> "$GITHUB_OUTPUT"
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.vars.outputs.publicar == 'true'

      - uses: docker/build-push-action@v6
        if: steps.vars.outputs.publicar == 'true'
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.repository }}:${{ github.sha }}
            ${{ steps.vars.outputs.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cluster:
    name: Conferir cluster (${{ github.ref_name == 'main' && 'prod' || 'staging' }})
    needs: build-and-push-image
    if: ${{ !cancelled() && needs.build-and-push-image.result == 'success' && needs.build-and-push-image.outputs.publicada == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      existe: ${{ steps.cluster.outputs.existe }}
    env:
      AMBIENTE: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - id: cluster
        run: |
          if SAIDA=$(aws ssm get-parameter --name "/oficina/${AMBIENTE}/eks-cluster-name" 2>&1); then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          elif grep -q ParameterNotFound <<<"$SAIDA"; then
            echo "::notice::Cluster de ${AMBIENTE} desligado, imagem publicada e deploy pulado."
            echo "existe=false" >> "$GITHUB_OUTPUT"
          else
            echo "$SAIDA"
            exit 1
          fi

  deploy:
    name: Deploy no EKS (${{ github.ref_name == 'main' && 'prod' || 'staging' }})
    needs: [build-and-push-image, cluster]
    if: ${{ !cancelled() && needs.build-and-push-image.result == 'success' && needs.cluster.outputs.existe == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
    concurrency:
      group: deploy-execution-service-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AMBIENTE: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
      NAMESPACE: oficina
      SERVICO: execution-service
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - uses: imranismail/setup-kustomize@v2

      - name: Resolver cluster e imagem do SSM
        run: |
          CLUSTER=$(aws ssm get-parameter --name "/oficina/${AMBIENTE}/eks-cluster-name" \
            --query 'Parameter.Value' --output text)
          REPOSITORY=$(aws ssm get-parameter --name "/oficina/${AMBIENTE}/execution/ecr-repository-url" \
            --query 'Parameter.Value' --output text)
          echo "CLUSTER=${CLUSTER}" >> "$GITHUB_ENV"
          echo "REPOSITORY=${REPOSITORY}" >> "$GITHUB_ENV"

      - name: Aguardar cluster ACTIVE
        run: aws eks wait cluster-active --name "$CLUSTER" --region us-east-1

      - name: Configurar kubeconfig
        run: aws eks update-kubeconfig --name "$CLUSTER" --region us-east-1

      - name: Criar Secret a partir do SSM
        run: |
          ler() {
            aws ssm get-parameter --name "$1" --with-decryption --query 'Parameter.Value' --output text
          }
          if ! ENDPOINT=$(ler "/oficina/${AMBIENTE}/execution/docdb-endpoint" 2>&1); then
            if grep -q ParameterNotFound <<<"$ENDPOINT"; then
              echo "::error::DocumentDB de ${AMBIENTE} não provisionado: execute o workflow Infra com acao=apply."
            else
              echo "$ENDPOINT"
            fi
            exit 1
          fi
          BANCO=$(ler "/oficina/${AMBIENTE}/execution/docdb-database")
          USUARIO=$(ler "/oficina/${AMBIENTE}/execution/docdb-username")
          SENHA=$(ler "/oficina/${AMBIENTE}/execution/docdb-password")
          JWT_SECRET=$(ler "/oficina/${AMBIENTE}/jwt-secret")
          LICENCA_NEW_RELIC=$(ler "/oficina/${AMBIENTE}/newrelic-license-key")
          for valor in "$SENHA" "$JWT_SECRET" "$LICENCA_NEW_RELIC" "$USUARIO" "$ENDPOINT"; do
            echo "::add-mask::${valor}"
          done
          codificar() { jq -rn --arg valor "$1" '$valor | @uri'; }
          MONGODB_URI="mongodb://$(codificar "$USUARIO"):$(codificar "$SENHA")@${ENDPOINT}/${BANCO}?tls=true&replicaSet=rs0&readPreference=secondaryPreferred&retryWrites=false"
          echo "::add-mask::${MONGODB_URI}"
          kubectl create secret generic "${SERVICO}-secrets" -n "$NAMESPACE" \
            --from-literal=MONGODB_URI="$MONGODB_URI" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=NEW_RELIC_LICENSE_KEY="$LICENCA_NEW_RELIC" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar manifests com a imagem nova
        run: |
          cd "k8s/overlays/${AMBIENTE}"
          kustomize edit set image "servico=${REPOSITORY}:${{ needs.build-and-push-image.outputs.image_tag }}"
          kubectl apply -k .

      - name: Aguardar rollout
        run: kubectl rollout status "deployment/${SERVICO}" -n "$NAMESPACE" --timeout=600s

      - name: Smoke test
        run: |
          kubectl exec -n "$NAMESPACE" "deploy/${SERVICO}" -- wget -qO- http://localhost:8080/actuator/health/readiness
          echo
          kubectl exec -n "$NAMESPACE" "deploy/${SERVICO}" -- wget -qO- http://localhost:8080/actuator/info

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          kubectl get pods -n "$NAMESPACE" -l "app.kubernetes.io/name=${SERVICO}" -o wide
          kubectl describe "deployment/${SERVICO}" -n "$NAMESPACE"
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp | tail -30
          for p in $(kubectl get pods -n "$NAMESPACE" -l "app.kubernetes.io/name=${SERVICO}" -o name); do
            echo "=== describe $p ==="; kubectl describe -n "$NAMESPACE" "$p"
            echo "=== logs $p ==="
            kubectl logs -n "$NAMESPACE" "$p" --tail=100 --all-containers --previous 2>/dev/null \
              || kubectl logs -n "$NAMESPACE" "$p" --tail=100 --all-containers
          done
