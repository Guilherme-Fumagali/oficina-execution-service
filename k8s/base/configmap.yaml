apiVersion: v1
kind: ConfigMap
metadata:
  name: execution-service-config
  labels:
    app.kubernetes.io/name: execution-service
    app.kubernetes.io/part-of: oficina
data:
  SPRING_PROFILES_ACTIVE: k8s
  ENV: local
  NEW_RELIC_APP_NAME: oficina-execution-service-local
  NEW_RELIC_LOG_FILE_NAME: STDOUT
  NEW_RELIC_LABELS: fase:tech-challenge-4
  AWS_REGION: us-east-1
  FILA_EXECUTION_COMANDOS: oficina-local-execution-comandos
  FILA_OS_EVENTOS: oficina-local-os-eventos
  FILA_DLQ: oficina-local-execution-comandos-dlq
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: https://otlp.nr-data.net/v1/metrics
  METRICS_EXPORT_STEP: 60s
