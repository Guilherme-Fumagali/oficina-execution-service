services:
  mongo:
    image: mongo:6.0.14
    container_name: execution-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status(); } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}); } quit(db.hello().isWritablePrimary ? 0 : 1);"]
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 20
    networks:
      - execution-net

  localstack:
    image: localstack/localstack:3
    container_name: execution-localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name oficina-local-os-eventos > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 30
    networks:
      - execution-net

  api:
    build: .
    container_name: execution-api
    depends_on:
      mongo:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      MONGODB_URI: mongodb://mongo:27017/execucao?replicaSet=rs0
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      ENV: local
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    networks:
      - execution-net

networks:
  execution-net:

volumes:
  mongodata:
